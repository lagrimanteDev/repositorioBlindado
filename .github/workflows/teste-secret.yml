name: Teste de Proteção de Secret

on:
  push:
    branches: [ main ] 
  workflow_dispatch: 

jobs:
  exibir-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Demonstração de Máscara de Segurança
        env:
          MINHA_SECRET: ${{ secrets.CHAVE_MESTRA }}
        run: |
          # O GitHub vai printar "O valor mascarado é: ***"
          echo "O valor mascarado é: $MINHA_SECRET"
          
          # Forma correta de usar em scripts sem expor nos logs:
          # ./seu-script.sh --api-key "$MINHA_SECRET"
